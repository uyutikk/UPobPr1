<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление товара | АЛКОСМО</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f9; color: #333; }
        header { background-color: #1a1a2e; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; }
        header .logo { color: #fff; font-size: 24px; font-weight: bold; text-decoration: none; }
        header nav a { color: #ddd; text-decoration: none; margin-left: 20px; transition: color 0.3s; }
        header nav a:hover { color: #e94560; }
        
        .container { max-width: 600px; margin: 40px auto; padding: 30px; background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #1a1a2e; margin-bottom: 25px; font-size: 28px; border-bottom: 2px solid #f4f4f9; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        
        .form-control { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; outline: none; transition: border-color 0.3s; }
        .form-control:focus { border-color: #e94560; }
        
        .form-check { display: flex; align-items: center; gap: 10px; }
        .form-check-input { width: 18px; height: 18px; cursor: pointer; }
        
        .btn-submit { display: block; width: 100%; padding: 14px; background-color: #e94560; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { background-color: #d13d56; }
        
        .error-msg { color: #e94560; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'catalog_view' %}" class="logo">АЛКОСМО</a>
        <nav>
            <a href="{% url 'info_view' %}">О нас</a>
            <a href="{% url 'catalog_view' %}">Каталог</a>
            <a href="{% url 'cart_view' %}">Корзина</a>
        </nav>
    </header>

    <div class="container">
        <h1>Новый товар</h1>
        
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group {% if field.field.widget.input_type == 'checkbox' %}form-check{% endif %}">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="error-msg">{{ field.errors|striptags }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            
            <button type="submit" class="btn-submit">Сохранить в базу</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameInput = document.getElementById('id_name');
            const slugInput = document.getElementById('id_slug');

            if (!nameInput || !slugInput) return;

            const ru2en = {
                'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd',
                'е': 'e', 'ё': 'yo', 'ж': 'zh', 'з': 'z', 'и': 'i',
                'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n',
                'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
                'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'ts', 'ч': 'ch',
                'ш': 'sh', 'щ': 'sch', 'ъ': '', 'ы': 'y', 'ь': '',
                'э': 'e', 'ю': 'yu', 'я': 'ya', ' ': '-'
            };

            function slugify(text) {
                text = text.toLowerCase();
                let result = '';
                for (let i = 0; i < text.length; i++) {
                    let char = text[i];
                    result += ru2en[char] !== undefined ? ru2en[char] : char;
                }
                return result
                    .replace(/[^a-z0-9-]/g, '') // Удаляем всё, кроме английских букв, цифр и дефиса
                    .replace(/-+/g, '-')        // Убираем двойные дефисы (например, если было два пробела подряд)
                    .replace(/^-+|-+$/g, '');   // Убираем дефисы в начале и в конце
            }

            let isSlugManuallyEdited = false;

            slugInput.addEventListener('input', function() {
                isSlugManuallyEdited = true;
                if (this.value === '') {
                    isSlugManuallyEdited = false;
                }
            });

            nameInput.addEventListener('input', function() {
                if (!isSlugManuallyEdited) {
                    slugInput.value = slugify(this.value);
                }
            });
        });
    </script>
</body>
</html>
