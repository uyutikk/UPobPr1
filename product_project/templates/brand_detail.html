{% extends 'base.html' %}

{% block title %}{{ brand.name }} - АЛКОСМО{% endblock %}

{% block content %}
<div class="detail-view" style="margin-top: 2rem;">
    {% if brand.image %}
    <img src="{{ brand.image.url }}" alt="{{ brand.name }}" class="detail-img">
    {% else %}
    <div class="detail-img" style="display:flex; justify-content:center; align-items:center; background:#e5e5e5; width:400px; height:400px;">
        <span style="color:#555555;">Нет логотипа</span>
    </div>
    {% endif %}
    
    <div class="detail-info">
        <h1 style="margin-bottom: 1.5rem;">{{ brand.name }}</h1>
        
        <h3>Описание бренда:</h3>
        <p style="line-height: 1.6; color: #555555;">{{ brand.description|default:"Описание отсутствует" }}</p>
        
        <a href="{% url 'brand_list' %}" class="btn" style="margin-top: 2rem;">Назад к брендам</a>
    </div>
</div>
{% endblock %}
