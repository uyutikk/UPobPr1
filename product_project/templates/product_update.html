{% extends 'base.html' %}

{% block title %}Редактировать товар - АЛКОСМО{% endblock %}

{% block content %}
<div class="form-container">
    <h1>Редактировать: {{ product.name }}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-group {% if field.field.widget.input_type == 'checkbox' %}form-check{% endif %}">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="error-msg">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Сохранить изменения</button>
            <a href="{% url 'category_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
