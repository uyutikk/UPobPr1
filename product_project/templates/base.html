<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}АЛКОСМО{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #e50914;
            --accent-hover: #b9090b;
            --card-bg: #f8f9fa;
            --border-color: #e5e5e5;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #000000;
            border-bottom: 3px solid var(--accent-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-color);
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Footer */
        footer {
            background-color: #000000;
            color: #ffffff;
            border-top: 3px solid var(--accent-color);
            padding: 2rem;
            text-align: center;
            margin-top: auto;
        }

        /* Cards and Lists */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: var(--text-color);
        }

        .card-img-wrapper {
            height: 200px;
            overflow: hidden;
            background-color: #e5e5e5;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            color: var(--text-color);
            text-decoration: none;
        }

        .card-title:hover {
            color: var(--accent-color);
        }

        .card-text {
            color: #555555;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-align: center;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 3rem 0;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .hero p {
            font-size: 1.2rem;
            color: #555555;
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }

        /* Detail View */
        .detail-view {
            display: flex;
            gap: 3rem;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .detail-img {
            max-width: 400px;
            border-radius: 4px;
            object-fit: cover;
        }

        .detail-info h1 {
            margin-top: 0;
            font-size: 2.5rem;
        }

        .breadcrumbs {
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #555555;
        }

        .breadcrumbs a {
            color: var(--accent-color);
            text-decoration: none;
        }

        .breadcrumbs a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .detail-view {
                flex-direction: column;
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
        }

        /* Forms */
        .form-container {
            max-width: 650px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2.5rem;
        }

        .form-container h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
            background-color: #fff;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.15);
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .form-check-input {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .error-msg {
            color: var(--accent-color);
            font-size: 0.85rem;
            margin-top: 0.4rem;
        }

        /* Button Variants */
        .btn-success {
            background-color: #10b981;
        }

        .btn-success:hover {
            background-color: #059669;
        }

        .btn-secondary {
            background-color: #6b7280;
        }

        .btn-secondary:hover {
            background-color: #4b5563;
        }

        .btn-danger {
            background-color: #ef4444;
        }

        .btn-danger:hover {
            background-color: #dc2626;
        }

        .btn-sm {
            padding: 0.4rem 0.8rem;
            font-size: 0.8rem;
        }

        /* Action buttons on cards */
        .card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .card-actions a {
            flex: 1;
        }

        /* Delete Confirmation */
        .delete-confirm {
            max-width: 500px;
            margin: 3rem auto;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2.5rem;
            text-align: center;
        }

        .delete-confirm h1 {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ef4444;
        }

        .delete-confirm p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 2rem;
        }

        .delete-confirm .form-actions {
            justify-content: center;
        }

        /* Page header with action button */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .page-header h1 {
            margin: 0;
        }
    </style>
</head>

<body>

    <header>
        <div class="header-content">
            <a href="{% url 'index' %}" class="logo">АЛКО<span>СМО</span></a>
            <nav>
                <a href="{% url 'index' %}">Главная</a>
                <a href="{% url 'info' %}">О компании</a>
                <a href="{% url 'category_list' %}">Каталог</a>
                <a href="{% url 'brand_list' %}">Бренды</a>
                <a href="{% url 'store_list' %}">Магазины</a>
                <a href="{% url 'employee_list' %}">Сотрудники</a>
                <a href="{% url 'supplier_list' %}">Поставщики</a>
                <a href="{% url 'cart' %}">Корзина</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 АЛКОСМО. Все права защищены. Чрезмерное употребление алкоголя вредит вашему здоровью.</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameInput = document.getElementById('id_name');
            const slugInput = document.getElementById('id_slug');
            
            if (nameInput && slugInput) {
                const translitMap = {
                    'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd', 'е': 'e', 'ё': 'yo', 'ж': 'zh',
                    'з': 'z', 'и': 'i', 'й': 'j', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n', 'о': 'o',
                    'п': 'p', 'р': 'r', 'с': 's', 'т': 't', 'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'c',
                    'ч': 'ch', 'ш': 'sh', 'щ': 'shch', 'ъ': '', 'ы': 'y', 'ь': '', 'э': 'e', 'ю': 'yu',
                    'я': 'ya', ' ': '-', '_': '-'
                };

                function transliterate(text) {
                    return text.toLowerCase().split('').map(char => translitMap[char] || char).join('').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '');
                }

                nameInput.addEventListener('input', function() {
                    // Only auto-fill if user hasn't manually edited the slug
                    if (!slugInput.dataset.manualModified) {
                        slugInput.value = transliterate(nameInput.value);
                    }
                });

                slugInput.addEventListener('input', function() {
                    slugInput.dataset.manualModified = 'true';
                });
            }
        });
    </script>
</body>
</html>
