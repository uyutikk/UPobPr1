<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}АЛКОСМО{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --accent-color: #e50914; /* Красный */
            --accent-hover: #b9090b; /* Темно-красный */
            --card-bg: #f8f9fa; /* Светло-серый */
            --border-color: #e5e5e5;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header */
        header {
            background-color: #000000; /* Черный хедер */
            border-bottom: 3px solid var(--accent-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo span {
            color: var(--accent-color);
        }

        nav {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: 400;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        /* Main Content */
        main {
            flex: 1;
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
            box-sizing: border-box;
        }

        /* Footer */
        footer {
            background-color: #000000;
            color: #ffffff;
            border-top: 3px solid var(--accent-color);
            padding: 2rem;
            text-align: center;
            margin-top: auto;
        }

        /* Cards and Lists */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            border-color: var(--text-color);
        }

        .card-img-wrapper {
            height: 200px;
            overflow: hidden;
            background-color: #e5e5e5;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .card:hover .card-img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            color: var(--text-color);
            text-decoration: none;
        }

        .card-title:hover {
            color: var(--accent-color);
        }

        .card-text {
            color: #555555;
            font-size: 0.9rem;
            margin-bottom: 1rem;
            flex-grow: 1;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            text-align: center;
            border: none;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 3rem 0;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .hero p {
            font-size: 1.2rem;
            color: #555555;
            max-width: 600px;
            margin: 0 auto 2rem auto;
        }

        /* Detail View */
        .detail-view {
            display: flex;
            gap: 3rem;
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        .detail-img {
            max-width: 400px;
            border-radius: 4px;
            object-fit: cover;
        }

        .detail-info h1 {
            margin-top: 0;
            font-size: 2.5rem;
        }
        
        .breadcrumbs {
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: #555555;
        }
        
        .breadcrumbs a {
            color: var(--accent-color);
            text-decoration: none;
        }
        
        .breadcrumbs a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .detail-view {
                flex-direction: column;
            }
            .header-content {
                flex-direction: column;
                gap: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <a href="{% url 'index' %}" class="logo">АЛКО<span>СМО</span></a>
            <nav>
                <a href="{% url 'index' %}">Главная</a>
                <a href="{% url 'info' %}">О компании</a>
                <a href="{% url 'category_list' %}">Каталог</a>
                <a href="{% url 'brand_list' %}">Бренды</a>
                <a href="{% url 'store_list' %}">Магазины</a>
                <a href="{% url 'employee_list' %}">Сотрудники</a>
                <a href="{% url 'supplier_list' %}">Поставщики</a>
                <a href="{% url 'cart' %}">Корзина</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 АЛКОСМО. Все права защищены. Чрезмерное употребление алкоголя вредит вашему здоровью.</p>
    </footer>

</body>
</html>
