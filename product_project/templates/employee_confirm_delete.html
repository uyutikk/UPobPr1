{% extends 'base.html' %}

{% block title %}Удалить сотрудника - АЛКОСМО{% endblock %}

{% block content %}
<div class="delete-confirm">
    <h1>Удаление сотрудника</h1>
    <p>Вы действительно хотите удалить сотрудника <strong>«{{ object.first_name }} {{ object.last_name }}»</strong>? Это действие нельзя отменить.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'employee_list' %}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
