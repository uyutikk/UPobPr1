<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f4f9; color: #333; }
        header { background-color: #1a1a2e; padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; }
        header .logo { color: #fff; font-size: 24px; font-weight: bold; text-decoration: none; }
        header nav a { color: #ddd; text-decoration: none; margin-left: 20px; transition: color 0.3s; }
        header nav a:hover { color: #e94560; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 20px; }
        .search-bar { display: flex; margin-bottom: 40px; }
        .search-bar input { flex: 1; padding: 15px; border: 1px solid #ccc; border-radius: 4px 0 0 4px; font-size: 16px; outline: none; }
        .search-bar button { padding: 15px 30px; background-color: #e94560; color: white; border: none; border-radius: 0 4px 4px 0; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .search-bar button:hover { background-color: #d13d56; }

        .categories { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .category-card { background: #fff; padding: 40px 20px; text-align: center; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s; }
        .category-card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .category-card h3 { color: #1a1a2e; font-size: 20px; }
        
        .empty-categories { grid-column: 1 / -1; text-align: center; font-size: 18px; color: #666; padding: 40px; }
    </style>
</head>
<body>
    <header>
        <a href="#" class="logo">АЛКОСМО</a>
        <nav>
            <a href="{% url 'info_view' %}">О нас</a>
            <a href="{% url 'catalog_view' %}">Каталог</a>
            <a href="{% url 'cart_view' %}">Корзина</a>
        </nav>
    </header>

    <div class="container">
        <div class="search-bar">
            <input type="text" placeholder="Поиск товаров...">
            <button>Найти</button>
        </div>

        <div class="categories">
            {% for category in categories %}
                <a href="{% url 'category_detail' category.slug %}" style="text-decoration: none;">
                    <div class="category-card">
                        <h3>{{ category.name }}</h3>
                    </div>
                </a>
            {% empty %}
                <div class="empty-categories">
                    <p>Категории пока не добавлены. Зайдите в панель администратора и создайте их!</p>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
